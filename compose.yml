# Migration Sentinel — one-command local stack.
#   cp .env.example .env      # optional; sane dev defaults are baked in below
#   docker compose up --build
#
# Then: frontend http://localhost:3000, API http://localhost:8080/swagger-ui.html
#
# Self-contained on purpose — Kafka, RustFS and a Docker-in-Docker engine for the
# Testcontainers sandbox all run here, so `sandbox_used` is true out of the box and
# a judge needs nothing but Docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5440:5432"
    volumes:
      - sentinel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The disposable-sandbox engine. Testcontainers inside the backend talks to THIS
  # daemon, not the host's — which sidesteps the Docker Desktop npipe incompatibility
  # that left every review "structure-only" when the host socket was mounted in.
  dind:
    image: docker:27-dind
    container_name: sentinel-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - sentinel_dind:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: sentinel-rustfs
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ROOT_USER: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${S3_SECRET_KEY:-rustfsadmin}
    volumes:
      - sentinel_rustfs:/data
    healthcheck:
      # RustFS answers the S3 API on :9000; an unauthenticated GET returns 403, which is a
      # healthy server. `curl` without -f exits 0 for any HTTP response received.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    depends_on:
      postgres:
        condition: service_healthy
      dind:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinel_db
      DB_USERNAME: sentinel
      DB_PASSWORD: sentinel
      CORS_ALLOWED_ORIGIN: http://localhost:3000

      # Agent brain — heuristic by default; drop a key in .env to use a real model.
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}

      # Sandbox → the dind engine, not the host.
      DOCKER_HOST: tcp://dind:2375
      TESTCONTAINERS_HOST_OVERRIDE: dind
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}

      # Messaging → transactional outbox relayed to Kafka.
      SENTINEL_MESSAGING_TRANSPORT: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SENTINEL_JOB_POOL_SIZE: ${SENTINEL_JOB_POOL_SIZE:-2}

      # Per-request LLM key encryption. Dev value; override in .env for anything real.
      SENTINEL_CRYPTO_SECRET: "${SENTINEL_CRYPTO_SECRET:-ZGV2LW9ubHktc2VudGluZWwtY3J5cHRvLWtleS0zMmI=}"

      # Object storage → RustFS. Credentials come from .env (defaults match the rustfs service).
      SENTINEL_S3_ENABLED: "true"
      SENTINEL_S3_ENDPOINT_INTERNAL: http://rustfs:9000
      SENTINEL_S3_ENDPOINT_PUBLIC: ${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      SENTINEL_S3_BUCKET: ${S3_BUCKET_NAME:-migration-sentinel}
      SENTINEL_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      SENTINEL_S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      SENTINEL_S3_MAX_FILE_SIZE: ${SENTINEL_S3_MAX_FILE_SIZE:-10MB}
      SENTINEL_MAX_UPLOAD_SIZE: ${SENTINEL_MAX_UPLOAD_SIZE:-25MB}
    ports:
      - "8080:8080"
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL_INTERNAL: http://backend:8080
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: sentinel-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_BASE_URL_INTERNAL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  sentinel_pg:
  sentinel_dind:
  sentinel_rustfs:
