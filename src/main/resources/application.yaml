spring:
  application:
    name: migration-sentinel
  profiles:
    active: ${PROFILE_ACTIVE:default}

  # Kafka beans are built by hand in config/KafkaConfig, and only when
  # sentinel.messaging.transport=kafka. Excluding the auto-configuration keeps the
  # `local` transport (tests, bootRun) free of any broker client.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:sentinel_db}
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:sentinel}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: sentinel
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sentinel
    default-schema: sentinel
    create-schemas: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: ${SENTINEL_MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${SENTINEL_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,scheduledtasks
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

app:
  version: "@project.version@"

sentinel:
  cors-allowed-origins:
    - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  eval-corpus-path: classpath:eval/cases
  jobs:
    pool-size: ${SENTINEL_JOB_POOL_SIZE:2}
    queue-capacity: ${SENTINEL_JOB_QUEUE_CAPACITY:50}
  messaging:
    # local  = in-process, AFTER_COMMIT dispatch on a bounded pool (default; tests, bootRun)
    # kafka  = transactional outbox relayed to Kafka, consumed by a worker pool
    transport: ${SENTINEL_MESSAGING_TRANSPORT:local}
    consumer-group: ${SENTINEL_MESSAGING_CONSUMER_GROUP:sentinel-workers}
    topic-partitions: ${SENTINEL_MESSAGING_TOPIC_PARTITIONS:3}
    outbox:
      sweep-interval-ms: ${SENTINEL_OUTBOX_SWEEP_INTERVAL_MS:5000}
      sweep-batch-size: ${SENTINEL_OUTBOX_SWEEP_BATCH_SIZE:200}
      immediate-grace-seconds: ${SENTINEL_OUTBOX_IMMEDIATE_GRACE_SECONDS:10}
      max-retries: ${SENTINEL_OUTBOX_MAX_RETRIES:50}
      send-timeout-ms: ${SENTINEL_OUTBOX_SEND_TIMEOUT_MS:10000}
  large-table-row-threshold: ${SENTINEL_LARGE_TABLE_ROW_THRESHOLD:1000000}
  rewrite-output-dir: ${SENTINEL_REWRITE_OUTPUT_DIR:./rewrites}
  rewrite-apply-enabled: ${SENTINEL_REWRITE_APPLY_ENABLED:false}
  crypto:
    # base64 of 32 bytes. Unset -> ephemeral key (single-process bootRun only). The compose
    # stack sets a fixed dev value; a real deployment injects a secret.
    secret: ${SENTINEL_CRYPTO_SECRET:}
  s3:
    # Credentials and endpoints come from the environment (.env for the compose stack).
    # No secret has a compiled-in default; unset simply means S3 is not usable.
    enabled: ${SENTINEL_S3_ENABLED:false}
    endpoint-internal: ${SENTINEL_S3_ENDPOINT_INTERNAL:}
    endpoint-public: ${SENTINEL_S3_ENDPOINT_PUBLIC:}
    bucket: ${SENTINEL_S3_BUCKET:migration-sentinel}
    access-key: ${SENTINEL_S3_ACCESS_KEY:}
    secret-key: ${SENTINEL_S3_SECRET_KEY:}
    region: ${SENTINEL_S3_REGION:us-east-1}
    path-style-access: ${SENTINEL_S3_PATH_STYLE:true}
    presign-expiry: ${SENTINEL_S3_PRESIGN_EXPIRY:15m}
    max-file-size: ${SENTINEL_S3_MAX_FILE_SIZE:10MB}
  llm:
    provider: ${SENTINEL_LLM_PROVIDER:heuristic}
    max-tool-iterations: ${SENTINEL_LLM_MAX_TOOL_ITERATIONS:12}
    request-timeout: ${SENTINEL_LLM_REQUEST_TIMEOUT:90s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-flash-latest}
  sandbox:
    postgres-image: ${SENTINEL_SANDBOX_IMAGE:postgres:16-alpine}
    migration-timeout: ${SENTINEL_SANDBOX_MIGRATION_TIMEOUT:60s}
    statement-timeout: ${SENTINEL_SANDBOX_STATEMENT_TIMEOUT:45s}
    reuse-within-evaluation: true

logging:
  level:
    com.migrationsentinel: ${SENTINEL_LOG_LEVEL:INFO}
    org.testcontainers: WARN
    org.flywaydb: WARN
    tc: WARN
