# Standalone profile: the app's own metadata DB is an in-memory H2 running in Postgres
# compatibility mode, so `./gradlew bootRun` needs no external database. The disposable
# sandbox the agent's tools use still needs a Docker daemon.
spring:
  datasource:
    url: jdbc:h2:mem:sentinel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS sentinel
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sentinel
  flyway:
    enabled: true
    schemas: sentinel
    default-schema: sentinel
    create-schemas: true
